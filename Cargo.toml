[package]
name = "streamforge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small partitioned event log for learning storage and delivery semantics"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

